<form>
    <div class="row g-3">
        <!-- <div class="col-12 d-flex align-items-center gap-3">
            @for (type of fieldsType(); track $index) {
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault{{ $index }}">
                    <label class="form-check-label" for="radioDefault{{ $index }}">
                        {{ type }}
                    </label>
                </div>
            }
        </div> -->

        <div class="col-lg-3 col-md-6">
            <div class="input-group align-items-center rounded-5 ps-1 pe-2 bg-gray-200">
                <span class="badge bg-primary-600 rounded-circle me-2" id="field-location">
                    <i class="icon-egypt-map text-white"></i>
                </span>
                <ng-select
                    [items]="governorates()" 
                    bindLabel="name_en" 
                    bindValue="id"
                    class="flex-grow-1"
                    placeholder="Select Governorate"
                    (change)="onSelectGovernorate($event)"
                />
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="input-group align-items-center rounded-5 ps-1 pe-2 bg-gray-200">
                <span class="badge bg-primary-600 rounded-circle me-2" id="field-location">
                    <i class="icon-map-pin text-white"></i>
                </span>
                <ng-select
                    [items]="cities()" 
                    bindLabel="name_en" 
                    bindValue="id"
                    class="flex-grow-1"
                    placeholder="Select City"
                    (change)="onSelectCity($event)"
                />
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="input-group align-items-center rounded-5 ps-1 pe-2 bg-gray-200">
                <span class="badge bg-primary-600 rounded-circle me-2" id="field-location">
                    <i class="icon-pitch text-white"></i>
                </span>
                <ng-select
                    [items]="fields()" 
                    bindLabel="name" 
                    bindValue="id"
                    class="flex-grow-1"
                    placeholder="Select Field"
                />
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="input-group align-items-center rounded-5 ps-1 pe-2 bg-gray-200">
                <span class="badge bg-primary-600 rounded-circle me-2" id="day">
                    <i class="icon-calendar text-white"></i>
                </span>
                <input type="date" format="dd-mm-yyyy" class="form-control" placeholder="20-02-2026" aria-label="Day" aria-describedby="day">
            </div>
        </div>

       

        <div class="text-end">
            <button type="submit" class="btn btn-primary pe-1 rounded-5 h-100">
                Check Availability
    
                <span class="badge ms-2 bg-white rounded-circle">
                    <i class="icon-arrow-up-right text-black" style="font-size: 0.5rem;"></i>
                </span>
            </button>
        </div>
    </div>

</form>
