<div class="container py-5">
    <div class="card card-body shadow gap-0">

        <h2 class="fs-3 fw-bold mb-0 card-title">Quick Field Reservation</h2>
        <div class="line my-4"></div>

        <form>
            <div class="row">
                <div class="col-md-2">
                    <div class="form-group">
                        <label for="area">Area</label>
                        <select name="" id="area" class="form-select">
                            <option value selected>Select a Area</option>
                            <option value="1">area 1</option>
                            <option value="2">area 2</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-group">
                        <label for="fields">Fields</label>
                        <select name="" id="fields" class="form-select">
                            <option value selected>Select a field</option>
                            <option value="1">field 1</option>
                            <option value="2">field 2</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-group">
                        <label for="players">Players </label>
                        <select name="" id="players" class="form-select">
                            <option value="5">5</option>
                            <option value="7">7</option>
                            <option value="12">12</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="fullname">Full name</label>
                        <input type="text" name="fullname" id="fullname" class="form-control" placeholder="Enter your full name">
                    </div>
                </div>
                 <div class="col-md-3">
                    <div class="form-group">
                        <label for="mobile">Mobile number</label>
                        <input type="tel" name="mobile" id="mobile" class="form-control" placeholder="+966-5xxxxxxxx">
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
