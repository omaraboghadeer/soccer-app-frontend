<section class="bg-primary-600 d-flex align-items-end pb-5" style="min-height: 20vh;">
    <div class="container">
        <h1 class="text-white mb-0">Reservation Form</h1>
        <h6 class="text-gray-200 mb-0">Complete your reservation in 4 easy steps</h6>
    </div>
</section>


<section class="position-relative py-3">
    <div class="container bg-white rounded-3 p-5">
        <div class="row">
            <div class="col-md-3">
                <div class="vertical-step-container">
                    <ul class="stepper-steps">
                        @for (step of steps(); track $index) {
                            <li class="stepper-step" [class.active]="step.active" [class.completed]="step.completed">
                                <div class="step-icon">
                                    <div class="step-number">{{ $index + 1 }}</div>
                                </div>
                                <p class="step-label">{{ step.label }}</p>
                            </li>
                        }
                    </ul>
                </div>
            </div>
            <div class="col-md-9">
                <div class="step-content">
                    <h2 class="mb-4">{{ steps()[currentStepIndex()].title }}</h2>
                    <ng-container #stepperContentContainer></ng-container>
                </div>

                <div class="d-flex justify-content-end gap-3 mt-5">
                    @if (currentStepIndex() === steps().length - 1) {
                        <a role="button" class="btn btn-primary" routerLink="/">
                            Return to Home
                        </a>
                    } @else {
                        <button class="btn btn-secondary" 
                            type="button"
                            (click)="previousStep()" 
                            [hidden]="currentStepIndex() === 0">
                            Previous
                        </button>
                        <button class="btn btn-primary"
                            type="button" 
                            (click)="nextStep()" >
                            Next
                        </button>
                    }
                </div>
            </div>
        </div>
    </div>
</section>
